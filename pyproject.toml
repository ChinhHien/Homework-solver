[project]
name = "homework-llm-solver"
version = "0.1.0"
description = "CLI that uses an OpenAI-compatible LLM to solve homework from PDF/DOCX (text + images)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40.0",
  "python-dotenv>=1.0.1",
  "pymupdf>=1.24.0",
  "python-docx>=1.1.2",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "ddgs>=9.0.0",
  "pillow>=10.4.0",
]

[project.scripts]
homework-solve = "homework_solver.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
homework_solver = ["prompts/*.md"]
